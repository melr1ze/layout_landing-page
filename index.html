<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin="anonymous"
/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="header">
      <div class="header__top">
        <a
          href="#"
          class="icon"
        >
          <img
            src="./src/images/THE-MET.png"
            alt="The MET"
          />
        </a>
        <div class="header__icons">
          <a
            href="#"
            class="icon icon--phone"
          >
            <img
              src="./src/images/Icon-Phone-call.png"
              alt="Phone call"
            />
          </a>

          <a
            href="#"
            class="icon icon--menu"
          >
            <img
              src="./src/images/Icon-Burger-menu.png"
              alt="Menu"
            />
          </a>
        </div>
      </div>
      <div class="header__bottom">
        <h1 class="title">
          <img
            src="./src/images/Title.png"
            alt="title"
          />
        </h1>
      </div>
    </header>

    <aside class="menu"></aside>

    <main class="main">
      <section class="museum hours">
        <h2>Museum hours</h2>
      </section>

      <section class="now On view">
        <h3>Now On View</h3>
      </section>

      <section class="explore online">
        <h4>More to Explore Online</h4>
      </section>

      <section class="Contacts">
        <h5>Contact us</h5>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
