<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
    <link
      rel="stylesheet"
      href="styles.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page__body">
    <header class="header">
      <div
        class="header__top"
        id="header-top"
      >
        <a
          href="#"
          class="icon"
        >
          <img
            src="./src/images/THE-MET.png"
            alt="The MET"
          />
        </a>
        <div class="header__icons">
          <a
            href="#"
            class="icon icon--phone"
          >
            <img
              src="./src/images/Icon-Phone-call.png"
              alt="Phone call"
            />
          </a>

          <a
            href="#menu"
            class="icon icon--menu"
          >
            <img
              src="./src/images/Icon-Burger-menu.png"
              alt="Menu"
            />
          </a>
        </div>
      </div>
      <div class="header__bottom">
        <h1 class="title">
          Welcome
          <br />
          to The MET
        </h1>
      </div>
    </header>

    <aside
      class="menu page__menu"
      id="menu"
    >
      <div class="menu__top">
        <a
          href="#"
          class="icon"
        >
          <img
            src="./src/images/THE-MET.png"
            alt="The MET"
          />
        </a>

        <a
          href="#"
          class="icon icon--close"
        >
          <img
            src="./src/images/Icon-Close.png"
            alt="close-menu"
          />
        </a>
      </div>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="#">Home</a></li>

          <li class="nav__item"><a href="#museum hours">About Us</a></li>

          <li class="nav__item"><a href="#now on view">Now on view</a></li>

          <li class="nav__item">
            <a href="#explore online">Explore Online</a>
          </li>

          <li class="nav__item"><a href="#contact us">Contacts</a></li>
        </ul>
      </nav>

      <div class="aside__content">
        <div class="contact__1">The Met Fifth Avenue</div>

        <a
          href="tel:+1 212-535-7710"
          class="call__number"
        >
          +1 212-535-7710
        </a>

        <div class="contact__2">The Met Cloisters</div>

        <a
          href="tel:+1 212-923-3700"
          class="call__number"
        >
          +1 212-923-3700
        </a>
      </div>

      <div class="call__order">Call to order</div>
    </aside>

    <main class="main">
      <section
        class="museum hours"
        id="museum hours"
      >
        <h2>Museum hours</h2>
      </section>

      <section
        class="now On view"
        id="now On view"
      >
        <h3>Now On View</h3>
      </section>

      <section
        class="explore online"
        id="explore online"
      >
        <h4>More to Explore Online</h4>
      </section>

      <section
        class="contact us"
        id="contact us"
      >
        <h5>Contact us</h5>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
